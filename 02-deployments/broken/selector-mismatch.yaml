# Deliberately broken: selector says app=web, template says app=webapp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-mismatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.4
