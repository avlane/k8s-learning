# Deliberately broken: networking.k8s.io/v1 requires pathType.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: no-pathtype
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            backend:
              service:
                name: web
                port:
                  number: 80
