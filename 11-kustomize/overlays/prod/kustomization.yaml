apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
replicas:
  - name: web
    count: 4
images:
  - name: nginxinc/nginx-unprivileged
    newTag: 1.29.1
patches:
  - path: resources-patch.yaml
configMapGenerator:
  - name: web-config
    literals:
      - APP_MODE=production
