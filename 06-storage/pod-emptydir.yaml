apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
spec:
  securityContext:
    fsGroup: 65534
  containers:
    - name: writer
      image: busybox:1.37.0
      command: ["sh", "-c", "date > /data/started; sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: scratch
          mountPath: /data
  volumes:
    - name: scratch
      emptyDir: {}
