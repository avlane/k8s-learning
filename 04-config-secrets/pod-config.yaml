apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  labels:
    app: config-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27.4
      envFrom:
        - configMapRef:
            name: app-config
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
  volumes:
    - name: html
      configMap:
        name: app-config
        items:
          - key: index.html
            path: index.html
