apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-hpa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-hpa
  template:
    metadata:
      labels:
        app: web-hpa
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29.1
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: web-hpa
spec:
  selector:
    app: web-hpa
  ports:
    - port: 80
      targetPort: http
