apiVersion: v1
kind: Pod
metadata:
  name: hello-nginx
  labels:
    app: hello
    app.kubernetes.io/name: hello-nginx
    app.kubernetes.io/part-of: k8s-learning
spec:
  containers:
    - name: nginx
      image: nginxinc/nginx-unprivileged:1.29.1
      ports:
        - name: http
          containerPort: 8080
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
